<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>लीडरबोर्ड | गणित सेतु</title>
<link rel="stylesheet" href="assets/css/style.css">
<style>
.lb-controls{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;margin:18px 0}.lb-controls select{padding:12px;border:1px solid #ddd;border-radius:10px;font-size:16px}.lb-list{display:grid;gap:10px}.lb-row{display:grid;grid-template-columns:62px 1fr auto;gap:12px;align-items:center;padding:14px;border:1px solid #e6e6e6;border-radius:14px;background:#fff}.lb-rank{font-size:22px;font-weight:800;text-align:center}.lb-name h3{margin:0 0 4px}.lb-name p{margin:0;color:var(--muted);font-size:13px}.lb-score{text-align:right}.lb-score b{font-size:20px}.lb-score small{display:block;color:var(--muted)}.lb-note{margin:8px 0 16px;color:var(--muted)}@media(max-width:700px){.lb-controls{grid-template-columns:1fr 1fr}.lb-controls button{grid-column:1/-1}.lb-row{grid-template-columns:50px 1fr}.lb-score{grid-column:2;text-align:left}.lb-rank{font-size:18px}}
</style>
</head>
<body>
<header class="simple-header"><a href="tet.html">← वापस</a><div class="mini-brand">🏆 TET Leaderboard</div></header>
<main class="page narrow"><section class="panel">
<div class="section-head"><div><h1>🏆 टॉप रैंकिंग</h1><p class="muted">Ranking केवल चुनी गई परीक्षा और उसी Set के परिणामों से बनेगी।</p></div></div>
<div class="lb-controls">
<select id="examFilter"><option value="primary">प्राथमिक शिक्षक</option><option value="secondary">माध्यमिक शिक्षक</option></select>
<select id="setFilter"><option value="A">Set A</option><option value="B">Set B</option><option value="C">Set C</option></select>
<button class="primary-btn" id="loadLeaderboard" type="button">🏆 Ranking देखें</button>
</div>
<p class="lb-note" id="leaderboardInfo">चुनी गई परीक्षा और Set की रैंकिंग लोड करें।</p>
<div id="leaderboardList"><div class="empty-results"><span>🏆</span><h2>Leaderboard तैयार है</h2><p>ऊपर परीक्षा और Set चुनें।</p></div></div>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
