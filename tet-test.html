<!doctype html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>शिक्षक पात्रता परीक्षा टेस्ट | गणित सेतु</title>
<link rel="stylesheet" href="assets/css/style.css">
<style>
.test-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.test-meta span{padding:6px 9px;border-radius:8px;background:#f3f5f7}
#options button{display:block;width:100%;text-align:left;margin:9px 0;padding:13px;border:1px solid #ddd;border-radius:10px;background:#fff;cursor:pointer}
#options button.selected{border:2px solid #2563eb;background:#eff6ff}
.test-nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.success-box,.error-box{padding:18px;border-radius:12px;background:#f6f8fa;margin-top:14px}
</style>
</head>
<body>
<header class="simple-header">
  <a href="tet.html">← वापस</a>
  <div class="mini-brand">शिक्षक पात्रता परीक्षा</div>
</header>

<main class="page narrow">
<section class="panel test-panel">
 <div class="test-meta">
  <span id="testType">TET Test</span>
  <span id="setLabel">Set</span>
  <span id="testInfo">⏳ Test लोड हो रहा है...</span>
  <span id="timer">⏱️ 00:00</span>
 </div>

 <div id="loadingBox">⏳ Supabase से वास्तविक Test और Questions लोड हो रहे हैं...</div>

 <div id="testContent" style="display:none">
  <h1 id="questionNumber">प्रश्न 1</h1>
  <div class="question-box" id="questionText"></div>
  <div class="options" id="options"></div>

  <div class="test-nav">
   <button class="outline-btn" id="prevBtn" type="button">← पिछला</button>
   <button class="primary-btn" id="nextBtn" type="button">अगला प्रश्न →</button>
  </div>

  <div id="progressText" style="margin-top:12px"></div>
 </div>

 <div id="testMessage"></div>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/supabase.js"></script>
<script src="assets/js/tet.js?v=20260830-actual-tables1"></script>
</body>
</html>
