<!doctype html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>गणित सेतु | शिक्षक लॉगिन</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="auth-page">
<main class="auth-card">
  <div class="brand">
    <div class="logo-mark">GS</div>
    <div><h1>गणित सेतु</h1><p>शिक्षक पैनल</p></div>
  </div>
  <section class="form-box">
    <h2>शिक्षक लॉगिन</h2>
    <p class="muted">अपनी शिक्षक आईडी और पासवर्ड दर्ज करें</p>
    <label>शिक्षक आईडी</label>
    <input id="teacherId" placeholder="उदाहरण: GT-00001">
    <label>पासवर्ड</label>
    <input id="password" type="password" placeholder="पासवर्ड दर्ज करें">
    <button class="primary-btn" onclick="teacherLogin()">लॉगिन करें</button>
    <p class="demo-note">यह अभी Demo Version है। कोई भी ID और Password डालकर Login कर सकते हैं।</p>
    <p class="auth-switch">नया शिक्षक हैं? <a href="register.html">पंजीकरण करें</a></p>
  </section>
</main>
<script src="assets/js/app.js"></script>
</body>
</html>
