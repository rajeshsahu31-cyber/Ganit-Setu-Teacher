<script>
const p = new URLSearchParams(location.search);

const type = p.get('type') === 'secondary'
  ? 'secondary'
  : 'primary';

const hindi = type === 'secondary'
  ? 'माध्यमिक शिक्षक पात्रता परीक्षा'
  : 'प्राथमिक शिक्षक पात्रता परीक्षा';

document.getElementById('pageTitle').textContent = hindi;
document.getElementById('examTitle').textContent = hindi;

const info = type === 'primary'
  ? 'प्रत्येक Set में 150 प्रश्न • 150 अंक • 5 भाग • प्रत्येक भाग में 30 प्रश्न'
  : 'अपना Set चुनें। प्रत्येक Set का मौजूदा माध्यमिक शिक्षक पैटर्न यथावत रहेगा।';

document.getElementById('patternInfo').textContent = info;

document.querySelectorAll('.setPattern').forEach(el => {
  el.textContent = type === 'primary'
    ? '5 भाग • प्रत्येक भाग में 30 प्रश्न'
    : 'मौजूदा परीक्षा पैटर्न';
});

['A', 'B', 'C'].forEach(set => {

  const a = document.getElementById('set' + set);

  if (type === 'primary') {

    a.href = '#';

    a.addEventListener('click', function(e) {

      e.preventDefault();

      const lang = prompt(
        'भाषा-2 चुनें:\n\n' +
        '1 = English\n' +
        '2 = संस्कृत\n\n' +
        '1 या 2 लिखें'
      );

      if (lang === '1') {

        location.href =
          `tet-test.html?type=primary&set=${set}&lang=english`;

      } else if (lang === '2') {

        location.href =
          `tet-test.html?type=primary&set=${set}&lang=sanskrit`;

      } else if (lang !== null) {

        alert('कृपया केवल 1 या 2 चुनें।');

      }

    });

  } else {

    a.href = `tet-test.html?type=${type}&set=${set}`;

  }

});
</script>
