<!doctype html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>शिक्षक पंजीकरण | गणित सेतु</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="auth-page">
<main class="auth-card">
  <div class="brand">
    <div class="logo-mark">GS</div>
    <div><h1>गणित सेतु</h1><p>शिक्षक पंजीकरण</p></div>
  </div>
  <section class="form-box">
    <h2>नया शिक्षक पंजीकरण</h2>
    <p class="muted">अपनी जानकारी भरकर शिक्षक खाता बनाएं</p>
    <label>पूरा नाम</label><input placeholder="अपना पूरा नाम दर्ज करें">
    <label>मोबाइल नंबर</label><input inputmode="numeric" placeholder="10 अंकों का मोबाइल नंबर">
    <label>विद्यालय का नाम</label><input placeholder="विद्यालय का नाम दर्ज करें">
    <label>UDISE / DISE Code</label><input id="school_dise_code" name="school_dise_code" inputmode="numeric" maxlength="11" pattern="[0-9]{11}" placeholder="11 अंकों का UDISE / DISE Code दर्ज करें">
    <label>जिला</label><input placeholder="जिला दर्ज करें">
    <label>पासवर्ड</label><input type="password" placeholder="पासवर्ड बनाएं">
    <button class="primary-btn" type="button" onclick="registerTeacher()">पंजीकरण करें</button>
    <p class="auth-switch">पहले से खाता है? <a href="index.html">लॉगिन करें</a></p>
  </section>
</main>
<script>
function registerTeacher(){
  const diseCode = document.getElementById('school_dise_code').value.trim();
  if (!/^\d{11}$/.test(diseCode)) {
    alert('कृपया 11 अंकों का सही UDISE / DISE Code दर्ज करें।');
    document.getElementById('school_dise_code').focus();
    return;
  }
  alert('पंजीकरण का Supabase connection जोड़ने के बाद आपकी जानकारी सुरक्षित रूप से सेव होगी।');
}
</script>
</body></html>
